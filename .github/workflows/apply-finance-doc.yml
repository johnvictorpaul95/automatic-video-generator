name: Apply finance-doc engine
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate files and patch Root.tsx
        run: node setup-finance-doc.js .
      - name: Commit to feature branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b feature/vertical-financial-documentary-engine
          git add src/finance-doc src/Root.tsx
          git commit -m "Add vertical financial documentary engine"
          git push -u origin feature/vertical-financial-documentary-engine
